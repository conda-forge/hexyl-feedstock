schema_version: 1

context:
  version: "0.17.0"

package:
  name: hexyl
  version: ${{ version }}

source:
  url: https://github.com/sharkdp/hexyl/archive/v${{ version }}.tar.gz
  sha256: 72fa17397ad187eec6b295d02c7caabbb209a6e0d5706187b8a599bd5df8615e

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - hexyl --help

about:
  license: MIT
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: A command-line hex viewer
  homepage: https://github.com/sharkdp/hexyl

extra:
  recipe-maintainers:
    - apcamargo
    - danielnachun
